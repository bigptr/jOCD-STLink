apply plugin:'java'
apply plugin:'java-library'
apply plugin:'maven-publish'

version ='1.1.0'
sourceCompatibility = '23'
targetCompatibility = '23'

repositories {
    mavenLocal()
    mavenCentral()
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId 'br.org.certi'
            artifactId 'jocd-conn-javadoesusb'
            version '1.1.0'

            from components.java
        }
    }
}

ext.dpProjectPath = projectDir
task buildAll() {
    finalizedBy build
    doLast {
        // All dependencies.
        def dp = [ '../jocd' ]
        dp.each {
            ext.dpProjectPath = "${it}"
            exec {
                workingDir dpProjectPath
                if (System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')) {
                    // On windows:
                    commandLine 'cmd', '/c', 'gradlew.bat buildAll'
                } else {
                    // On linux:
                    commandLine 'bash', '-c', './gradlew buildAll'
                }
            }
        }
        println "\n\nBuilding $project.name"
    }
}

dependencies {
    api 'br.org.certi:jocd:1.1.0'
    api 'net.codecrete.usb:java-does-usb:1.2.1'
    
    testImplementation 'junit:junit:4.12'
    testImplementation 'net.jqwik:jqwik:1.8.0'
    testRuntimeOnly 'org.junit.vintage:junit-vintage-engine:5.10.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.0'
}

test {
    useJUnitPlatform()
}

build.finalizedBy(publishToMavenLocal)
