plugins {
    id 'application'
    id 'java'
    id 'org.graalvm.buildtools.native' version '0.10.4'
}

mainClassName = 'br.org.certi.stlinkflashtool.StLinkFlashTool'

version ='1.1.0'
sourceCompatibility = '23'
targetCompatibility = '23'

repositories {
    mavenLocal()
    mavenCentral()
}

jar {
  manifest {
    attributes(
      'Main-Class': mainClassName
    )
  }
}

ext.dpProjectPath = projectDir
task buildAll() {
    finalizedBy build
    doLast {
        // All dependencies (jOCD will be resolved by jocd-conn-javadoesusb).
        def dp = [ '../../../jocd-conn-javadoesusb' ]
        dp.each {
            ext.dpProjectPath = "${it}"
            exec {
                workingDir dpProjectPath
                if (System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows')) {
                    // On windows:
                    commandLine 'cmd', '/c', 'gradlew.bat buildAll'
                } else {
                    // On linux:
                    commandLine 'bash', '-c', './gradlew buildAll'
                }
            }
        }
        println "\n\nBuilding $project.name"
    }
}

dependencies {
    implementation 'br.org.certi:jocd-conn-javadoesusb:1.1.0'
}

// GraalVM Native Image configuration
graalvmNative {
    binaries {
        main {
            imageName = 'stlink-flash'
            mainClass = 'br.org.certi.stlinkflashtool.StLinkFlashTool'
            
            buildArgs.addAll(
                '--no-fallback',
                '--enable-native-access=ALL-UNNAMED',
                '-H:+ReportExceptionStackTraces',
                '--initialize-at-build-time=org.slf4j',
                '--initialize-at-run-time=net.codecrete.usb'
            )
            
            // Enable verbose output during build
            verbose = true
        }
    }
    
    toolchainDetection = false
}

task copyDependencies(type: Copy) {
   from configurations.compileClasspath
   into buildDir.toString() + "/libs"
}

build.finalizedBy(copyDependencies)
